<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431 431" role="img" aria-labelledby="title desc">
  <title id="title">Academic Search Premier</title>
  <desc id="desc">Logo reconstitue en vectoriel depuis une image PNG fournie localement.</desc>
  <defs>
    <linearGradient id="asp-green" x1="55" y1="73" x2="305" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55c658"/>
      <stop offset=".55" stop-color="#42b848"/>
      <stop offset="1" stop-color="#30963b"/>
    </linearGradient>
    <linearGradient id="asp-blue" x1="122" y1="360" x2="358" y2="143" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a4d82"/>
      <stop offset=".55" stop-color="#006098"/>
      <stop offset="1" stop-color="#075184"/>
    </linearGradient>
    <filter id="asp-text-outline" x="-12%" y="-12%" width="124%" height="124%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="outline"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="outline" operator="in" result="stroke"/>
      <feMerge>
        <feMergeNode in="stroke"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path fill="url(#asp-green)" d="M18 307C-21 185 64 57 185 13c72-26 147-11 190 40-141 26-273 110-357 254Z"/>
  <path fill="#2f883c" fill-opacity=".45" d="M18 307C-21 185 64 57 185 13c72-26 147-11 190 40-6 1-12 2-18 4C312 16 244 5 185 27 72 68-8 187 18 307Z"/>
  <path fill="url(#asp-blue)" d="M57 379C69 269 198 109 378 65c58 81 68 195 20 271-58 91-207 118-341 43Z"/>
  <path fill="#063a66" fill-opacity=".38" d="M57 379C69 269 198 109 378 65c4 6 8 12 12 19-176 48-299 204-311 301-7-2-15-4-22-6Z"/>
  <g fill="#05090d" filter="url(#asp-text-outline)" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="135" y="271" font-size="45">Academic</text>
    <text x="135" y="322" font-size="45">Search</text>
    <text x="135" y="373" font-size="45">Premier</text>
  </g>
  <text x="331" y="418" fill="#1c7bae" stroke="#ffffff" stroke-width="1.4" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">EBSCOhost</text>
</svg>
