<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Littré</title>
  <desc id="desc">Icône typographique inspirée d'une page de titre du Dictionnaire de la langue française d'Émile Littré.</desc>
  <rect width="256" height="256" rx="38" fill="#F7F0DE"/>
  <rect x="20" y="20" width="216" height="216" rx="24" fill="none" stroke="#2D251D" stroke-width="3"/>
  <rect x="31" y="31" width="194" height="194" rx="17" fill="none" stroke="#B79C6E" stroke-width="1.6"/>
  <text x="128" y="70" fill="#2D251D" font-family="Georgia, Times, serif" font-size="18" text-anchor="middle" letter-spacing="3">ÉMILE</text>
  <text x="128" y="122" fill="#15110D" font-family="Georgia, Times, serif" font-size="54" font-weight="700" text-anchor="middle">Littré</text>
  <path d="M62 140H194" stroke="#B79C6E" stroke-width="2.5" stroke-linecap="round"/>
  <text x="128" y="164" fill="#3A3026" font-family="Georgia, Times, serif" font-size="15" font-weight="700" text-anchor="middle">Dictionnaire</text>
  <text x="128" y="184" fill="#3A3026" font-family="Georgia, Times, serif" font-size="13" text-anchor="middle">de la langue française</text>
  <text x="128" y="214" fill="#6B5335" font-family="Georgia, Times, serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">1873</text>
</svg>
